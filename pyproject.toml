[project]
name = "bank-migration"
version = "1.0.0"
description = "UN Wallet Multi-Bank Data Migration Platform - Production-Grade Interbank ETL"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.6.3,<6",
    "cryptography>=48.0.0,<49",
    "defusedxml>=0.7.1,<1",
    "fastapi>=0.136.1,<1",
    "openai-agents>=0.17.2,<1",
    "openpyxl>=3.1.5,<4",
    "playwright>=1.60.0",
    "psycopg2-binary>=2.9.12,<3",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.1,<3",
    "python-docx>=1.2.0,<2",
    "python-multipart>=0.0.28,<1",
    "redis>=7.4.0,<8",
    "slowapi>=0.1.9,<1",
    "uvicorn>=0.46.0,<1",
]

[project.scripts]
bank-migration = "api_only:main"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".claude",
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "node_modules",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=60"
