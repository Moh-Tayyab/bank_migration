[project]
name = "bank-migration"
version = "1.0.0"
description = "UN Wallet Multi-Bank Data Migration Platform - Production-Grade Interbank ETL"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.6.3",
    "click>=8.3.3",
    "cryptography>=48.0.0",
    "fakeredis>=2.35.1",
    "fastapi>=0.136.1",
    "google-generativeai>=0.8.6",
    "numpy<2.0",
    "openai-agents>=0.17.2",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.28",
    "pyyaml>=6.0.3",
    "redis>=7.4.0",
    "uvicorn>=0.46.0",
]

[project.scripts]
bank-migration = "api_only:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
